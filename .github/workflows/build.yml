name: Blog build verification

on:
  pull_request:
  push:
    branches: [master, "codex/fix-rics-notebook-build-*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:content
      - run: node --test scripts/avatar.test.mjs
      - run: pnpm run lint
      - run: pnpm run build
      - run: node scripts/verify-ric-series.js
